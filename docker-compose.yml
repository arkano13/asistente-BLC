# Entorno local completo: docker compose up --build
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: asistentes }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  core:
    build: .
    command: sh -c "npm run db:migrate && npm run seed && npm run start:core"
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/asistentes
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on: [postgres, redis]
  gateway:
    build: .
    command: npm run start:gateway
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/asistentes
      REDIS_URL: redis://redis:6379
    depends_on: [core]
volumes:
  pgdata:
